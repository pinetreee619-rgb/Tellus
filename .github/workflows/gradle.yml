name: Gradle build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Keeps the write token out of .git/config, so only the publish step can use it.
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build and test every target on main
        if: github.ref == 'refs/heads/main'
        run: ./gradlew build --stacktrace

      - name: Build and test Minecraft 26.2 and 26.3 Fabric
        if: github.ref != 'refs/heads/main'
        run: ./gradlew -PtellusTargets=mc262,mc263 build --stacktrace

      - name: Print failed test details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for report in sorted(Path(".").glob("mc*/build/test-results/**/TEST-*.xml")):
              try:
                  suite = ElementTree.parse(report).getroot()
              except (OSError, ElementTree.ParseError) as error:
                  print(f"Cannot read {report}: {error}")
                  continue
              for test in suite.iter("testcase"):
                  for problem in list(test.findall("failure")) + list(test.findall("error")):
                      print(f"FAIL [{report.parts[0]}] {test.get('classname')}.{test.get('name')}")
                      print(f"  {problem.get('type', '')}: {problem.get('message', '')}")
                      for line in (problem.text or "").splitlines()[:40]:
                          print(f"  {line}")
          PY

      - name: Upload test reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tellus-test-reports-${{ github.sha }}
          path: |
            mc*/build/test-results/**
            mc*/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect installable Tellus JARs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tellus-jars"
          shopt -s nullglob
          for jar in mc*/build/libs/Tellus-*.jar; do
            case "$jar" in
              *-sources.jar|*-unshaded.jar|*-dev-shadow.jar) continue ;;
            esac
            cp -- "$jar" "$RUNNER_TEMP/tellus-jars/"
          done
          jars=("$RUNNER_TEMP"/tellus-jars/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "::error::No installable Tellus JARs were produced."
            exit 1
          fi

      - name: Upload installable Tellus JARs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tellus-jars-${{ github.sha }}
          path: ${{ runner.temp }}/tellus-jars/*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish the dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          # The Distant Horizons fork is built outside this repository, so its jars come from their own release.
          DH_RELEASE: distant-horizons-3.3.4-tellus.1
        run: |
          jars=$(ls mc*/build/libs/Tellus-*.jar | grep -vE -- '-(sources|unshaded|dev-shadow)\.jar$')
          # Downloads before the delete, so a missing release leaves the previous dev build in place.
          gh release download "$DH_RELEASE" --pattern '*.jar' --dir "$RUNNER_TEMP/dh"
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build $jars "$RUNNER_TEMP"/dh/*.jar --prerelease --target "$GITHUB_SHA" \
            --title "Dev build ${GITHUB_SHA::7}" \
            --notes "Built automatically from the latest commit on main. Not a stable release. The DistantHorizons jars are the Tellus fork from the $DH_RELEASE release."
